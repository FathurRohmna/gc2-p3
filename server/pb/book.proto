syntax = "proto3";

package user;

option go_package = "/pb";

service BookService {
  rpc RegisterBook (RegisterBookRequest) returns (BookResponse);
  rpc BorrowBook (BorrowBookRequest) returns (BorrowedBookResponse);
  rpc ReturnBook (ReturnBookRequest) returns (BorrowedBookResponse);
}

message RegisterBookRequest {
  string title = 1;
  string author = 2;
  string published_date = 3;
}

message BookResponse {
  string id = 1;
  string title = 2;
  string author = 3;
  string published_date = 4;
  string status = 5;
}

message BorrowBookRequest {
  string book_id = 1;
  string user_id = 2;
  string borrowed_date = 3;
}

message BorrowedBookResponse {
  string id = 1;
  string book_id = 2;
  string user_id = 3;
  string borrowed_date = 4;
  string return_date = 5;
}

message ReturnBookRequest {
  string book_id = 1;
  string user_id = 2;
  string return_date = 3;
}
